<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Py32Emu 调试台</title><link rel="stylesheet" href="/styles.css"></head>
<body><header><div><small>PY32 CORTEX-M0+ LAB</small><h1>Py32Emu 调试台</h1></div><span id="connection">等待加载</span></header>
<main>
  <section class="toolbar panel"><label>固件路径<input id="firmware" value="examples/hello_world/build/hello_world.elf"></label>
    <label>芯片<select id="chip"><option>py32f002ax5</option><option>py32f002a-32k</option></select></label>
    <button id="load" class="primary">加载</button><button data-command="reset">复位</button>
    <button data-command="step">单步</button><button id="run">运行 10,000 步</button></section>
  <section class="summary panel"><div><small>PC</small><strong id="pc">—</strong></div><div><small>周期</small><strong id="cycles">—</strong></div>
    <div><small>状态</small><strong id="status">—</strong></div><div><small>异常</small><strong id="exception">—</strong></div></section>
  <section class="columns"><div class="panel"><h2>核心寄存器</h2><div id="registers" class="registers"></div></div>
    <div class="panel"><h2>GPIO</h2><div id="gpio"></div><div class="inline compact"><select id="gpioPort"><option value="0">PA</option><option value="1">PB</option><option value="2">PF</option></select><input id="gpioPin" type="number" min="0" max="15" value="0"><button data-level="1">高</button><button data-level="0">低</button><button data-level="release">释放</button></div><h2>断点</h2><div class="inline"><input id="breakpoint" placeholder="0x08000100, 0x08000200"><button id="setBreakpoint">设置</button></div><small id="breakpointList">未设置</small></div></section>
  <section class="columns"><div class="panel"><h2>PC 附近反汇编</h2><div id="disassembly" class="disassembly"></div></div><div class="panel"><h2>USART1 终端</h2><pre id="terminal"></pre><div class="inline"><input id="terminalInput" placeholder="发送文本"><button id="sendTerminal">发送</button></div></div></section>
  <section class="panel"><div class="section-head"><h2>内存</h2><div class="inline"><input id="memoryAddress" value="0x20000000"><button id="readMemory">读取 64 字节</button></div></div><pre id="memory">尚未读取</pre></section>
  <section class="panel"><h2>COMP 模拟输入</h2><div class="inline compact"><select id="analogPin"><option value="1">PA1 / COMP1</option><option value="3">PA3 / COMP2</option></select><input id="analogMv" type="number" min="0" max="5000" value="1800"><button id="setAnalog">设置 mV</button></div></section>
  <p id="error"></p>
</main><script type="module" src="/app.js"></script></body></html>
